name: Scheduled Data Refresh

on:
  schedule:
    # Run daily at 2 AM UTC for maintenance sync
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: yarn install

      # Sync maintenance data from API before build.
      # Retries live in the script; if sync still fails, keep last-known JSON and deploy.
      - name: Sync maintenance data
        id: sync-maintenance
        continue-on-error: true
        run: yarn sync:maintenance
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1

      - name: Warn if maintenance sync failed
        if: steps.sync-maintenance.outcome == 'failure'
        run: |
          echo "::warning::Maintenance sync failed after retries. Deploying with existing src/data/maintenance.json."

      - run: yarn build
        env:
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}

      - name: Sync to S3
        run: aws s3 sync ./dist s3://staubracing.com --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
