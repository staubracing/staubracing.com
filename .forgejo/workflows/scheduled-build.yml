name: Scheduled Data Refresh

on:
  schedule:
    # Run daily at 2 AM UTC for maintenance sync
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      volumes:
        - /home/staubracing-rack/Projects/staubracing-site/data:/srv/staubracing-site

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install rsync
        run: |
          apt-get update && apt-get install -y rsync

      - run: corepack enable && yarn install

      # Sync maintenance data from API before build
      - name: Sync maintenance data
        run: yarn sync:maintenance
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1

      - run: yarn build
        env:
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}

      - name: Deploy to rack-server Nginx
        run: rsync -a --delete dist/ /srv/staubracing-site/
