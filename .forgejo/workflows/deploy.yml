name: Deploy to rack-server

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from admin page

permissions:
  contents: write # Allow pushing commits back to repo

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true # Cancel older runs if a new push arrives

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      volumes:
        - /home/staubracing-rack/Projects/staubracing-site/data:/srv/staubracing-site

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Need history for proper git operations

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install rsync
        run: |
          apt-get update && apt-get install -y rsync

      - run: corepack enable && yarn install

      # Sync maintenance data from API before build
      - name: Sync maintenance data
        run: yarn sync:maintenance
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1

      # Commit synced data back to repo (keeps local in sync with database)
      - name: Commit synced maintenance data
        run: |
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@rack-server.local"
          git config core.fileMode false
          if git diff --quiet src/data/maintenance.json; then
            echo "No changes to commit"
          else
            git add src/data/maintenance.json
            git commit -m "chore: sync maintenance data from database [skip ci]"
            git checkout -- . # discard incidental changes (e.g. yarn.lock rewrites) so the tree is clean before rebasing
            git pull --rebase origin main
            git push
          fi

      - run: yarn build
        env:
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}

      - name: Deploy to rack-server Nginx
        run: rsync -a --delete dist/ /srv/staubracing-site/
